name: Unit tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

env:
  # Creatio reference binaries are not in git (see .gitignore); they come from this release asset.
  CREATIO_BINARIES_TAG: creatio-binaries-10.2.601
  CREATIO_BINARIES_ASSET: creatio-net-core-10.2.601.zip

jobs:
  unit-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Download Creatio reference binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:CREATIO_BINARIES_TAG --pattern $env:CREATIO_BINARIES_ASSET --dir $env:RUNNER_TEMP
          Expand-Archive (Join-Path $env:RUNNER_TEMP $env:CREATIO_BINARIES_ASSET) -DestinationPath .application/net-core

      - name: Run unit tests
        run: dotnet test tests/UnitTests.slnx -c dev-n8 --logger "trx;LogFilePrefix=unit" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: TestResults/*.trx
          if-no-files-found: warn
